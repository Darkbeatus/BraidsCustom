name: Build Braids 909 Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Missing stmlib Dependency
        run: |
          if [ ! -d "stmlib" ]; then
            git clone https://github.com/pichenettes/stmlib.git stmlib
          fi

      - name: Install ARM GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential python3

      - name: Compile Braids and Generate WAV
        run: |
          COMPILER_FLAGS="CC=arm-none-eabi-gcc CXX=arm-none-eabi-g++ AR=arm-none-eabi-ar OBJCOPY=arm-none-eabi-objcopy SIZE=arm-none-eabi-size OPTIM=-O3"
          make -f braids/makefile $COMPILER_FLAGS clean
          make -f braids/makefile $COMPILER_FLAGS
          make -f braids/makefile $COMPILER_FLAGS wav

      - name: Save Firmware WAV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: braids-909-rumble-wav
          path: build/braids/braids.wav
